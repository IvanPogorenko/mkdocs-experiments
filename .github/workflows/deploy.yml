name: Deploy MkDocs versions

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy version with mike
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mike deploy --push --update-aliases "$VERSION" latest

      - name: Show published versions
        run: |
          mike list

      - name: Checkout published gh-pages
        run: |
          rm -rf gh-pages
          git fetch origin gh-pages
          git worktree add gh-pages origin/gh-pages

      - name: Install AWS CLI
        run: |
          curl -fsSL https://awscli.amazonaws.com/v2/install.sh | sudo bash -s -- --system
          aws --version

      - name: Install Selectel S3 certificate
        run: |
          mkdir -p ~/.selectels3
          wget https://secure.globalsign.net/cacert/root-r6.crt \
            -O ~/.selectels3/root.crt
          openssl x509 \
            -inform der \
            -in ~/.selectels3/root.crt \
            -out ~/.selectels3/root.crt
          chmod 600 ~/.selectels3/root.crt

      - name: Deploy to Selectel S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SELECTEL_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SELECTEL_SECRET_KEY }}
        run: |
          aws s3 sync gh-pages/ s3://${{ vars.SELECTEL_BUCKET }}/ \
            --endpoint-url "${{ vars.SELECTEL_ENDPOINT }}" \
            --ca-bundle ~/.selectels3/root.crt \
            --delete